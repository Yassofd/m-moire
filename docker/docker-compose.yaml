networks:
  backup:
    name: backup

volumes:
  orderer.orderer.com:
  peer0.siege.com:
  peer0.spoke.com:

services:

  # ═══════════════════════════════════════════
  #                  ORDERER
  # ═══════════════════════════════════════════
  orderer.orderer.com:
    container_name: orderer.orderer.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # TLS
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      # Genesis
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/genesis.block
      # etcdraft
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17050
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - /home/yass/backup_hyperledger/consortium/channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - /home/yass/backup_hyperledger/consortium/crypto-config/ordererOrganizations/orderer.com/orderers/orderer.orderer.com/msp:/var/hyperledger/orderer/msp
      - /home/yass/backup_hyperledger/consortium/crypto-config/ordererOrganizations/orderer.com/orderers/orderer.orderer.com/tls:/var/hyperledger/orderer/tls
      - orderer.orderer.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
      - 17050:17050
    networks:
      - backup

  # ═══════════════════════════════════════════
  #              PEER0 — SIEGE
  # ═══════════════════════════════════════════
  peer0.siege.com:
    container_name: peer0.siege.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=backup
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.siege.com
      - CORE_PEER_ADDRESS=peer0.siege.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.siege.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.siege.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.siege.com:7051
      - CORE_PEER_LOCALMSPID=SiegeMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17051
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /home/yass/backup_hyperledger/consortium/crypto-config/peerOrganizations/siege.com/peers/peer0.siege.com/msp:/etc/hyperledger/fabric/msp
      - /home/yass/backup_hyperledger/consortium/crypto-config/peerOrganizations/siege.com/peers/peer0.siege.com/tls:/etc/hyperledger/fabric/tls
      - peer0.siege.com:/var/hyperledger/production
    ports:
      - 7051:7051
      - 17051:17051
    networks:
      - backup

  # ═══════════════════════════════════════════
  #              PEER0 — SPOKE
  # ═══════════════════════════════════════════
  peer0.spoke.com:
    container_name: peer0.spoke.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=backup
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.spoke.com
      - CORE_PEER_ADDRESS=peer0.spoke.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.spoke.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.spoke.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.spoke.com:8051
      - CORE_PEER_LOCALMSPID=SpokeMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17052
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /home/yass/backup_hyperledger/consortium/crypto-config/peerOrganizations/spoke.com/peers/peer0.spoke.com/msp:/etc/hyperledger/fabric/msp
      - /home/yass/backup_hyperledger/consortium/crypto-config/peerOrganizations/spoke.com/peers/peer0.spoke.com/tls:/etc/hyperledger/fabric/tls
      - peer0.spoke.com:/var/hyperledger/production
    ports:
      - 8051:8051
      - 17052:17052
    networks:
      - backup

  # ═══════════════════════════════════════════
  #                   CLI
  # ═══════════════════════════════════════════
  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.siege.com:7051
      - CORE_PEER_LOCALMSPID=SiegeMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/crypto/peerOrganizations/siege.com/peers/peer0.siege.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/crypto/peerOrganizations/siege.com/peers/peer0.siege.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/crypto/peerOrganizations/siege.com/peers/peer0.siege.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/crypto/peerOrganizations/siege.com/users/Admin@siege.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /home/yass/backup_hyperledger/consortium/crypto-config:/opt/crypto
      - /home/yass/backup_hyperledger/consortium/channel-artifacts:/opt/channel-artifacts
      - /home/yass/backup_hyperledger/chaincode-asset-transfer:/opt/chaincode
    networks:
      - backup